services:
  - type: web
    name: smartteamfoundation-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CLIENT
        value: sqlite
      - key: SQLITE_DB_PATH
        value: ./data/smartteam.sqlite
